name: Comments regression

on:
  pull_request:
    paths:
      - 'common.js'
      - 'comments.js'
      - 'photos.js'
      - 'memories.js'
      - 'photos/**'
      - 'memories/**'
      - 'supabase/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/comments.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
